name: release

# The family's release pipeline (as openblocks'): every push to main is a release. It picks
# the next sequential release-N tag, builds every platform, and publishes a GitHub Release
# with the archives: Linux x86_64, Windows x64 and x86, macOS universal (ad-hoc signed),
# each the single-file game (both modes) with README, LICENSE and NOTICE; the two web games,
# classic and modern; the Android APK and App Bundle; the iOS .ipa. Then, with the secrets
# set, the AAB goes to Play's internal track and the .ipa to TestFlight: testers only.
# Putting a build in front of the public is store-release.yml's, by hand.
#
# The tag is created in `publish` AFTER all builds succeed, so a failed build leaves N unused
# and the next run reuses it. The triggering commit SHA is captured in `prepare` and used
# everywhere, so a later push to main does not change what gets tagged. A GITHUB_TOKEN tag
# push starts no workflow, so this never retriggers itself.
#
# Cancelled has to be named explicitly in publish's gate: `!cancelled()` asks whether the
# RUN was cancelled, not whether a dependency was, and a cancelled job's result is neither
# 'success' nor 'failure', so a cancelled build would otherwise let a release ship missing
# a platform.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
      - 'android/play-assets/**'
      - 'ios/app-store-assets/**'
      - 'scripts/requirements.txt'
  # A manual run is a test, so it defaults to a dry run; a push to main is a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything; tag nothing, publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  # As ci.yml: raylib cached per platform (keyed on its script and the trim),
  # apt through scripts/apt_install.sh, a time limit on each download.
  # RELEASE_VERSION is passed to every build: it names the packages and is
  # the version the opening screen shows (release-N).
  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-linux-mingw-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-linux-mingw-ubuntu22-
      - name: Install Linux + mingw deps
        timeout-minutes: 60
        env:
          APT_ARCHIVES: /home/runner/apt-archives
        run: |
          ./scripts/apt_install.sh \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 zip \
            python3-numpy python3-pil xvfb libgl1-mesa-dri
      - name: Cache raylib (Linux)
        id: raylib-linux
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install
          key: raylib-linux-ubuntu22-${{ hashFiles('scripts/build_raylib_linux.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (Linux)
        if: steps.raylib-linux.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: xvfb-run -a -s '-screen 0 1280x800x24' make test   # a display, so test_harness runs
      - name: Cache raylib (mingw win64 + win32)
        id: raylib-windows
        uses: actions/cache@v6
        with:
          path: |
            third_party/raylib-install-win64
            third_party/raylib-install-win32
          key: raylib-windows-ubuntu22-${{ hashFiles('scripts/build_raylib_windows.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (mingw win64 + win32)
        if: steps.raylib-windows.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_windows.sh
      - name: Package Linux + Windows archives
        run: make dist-linux dist-windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Cache raylib (universal arm64 + x86_64)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-mac
          key: raylib-mac-macos14-${{ hashFiles('scripts/build_raylib_mac.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (universal arm64 + x86_64)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_mac.sh
      - name: Package macOS archive
        run: make dist-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Emscripten
        timeout-minutes: 15
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.3
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-zip-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-zip-ubuntu22-
      - name: Install zip
        timeout-minutes: 60
        env:
          APT_ARCHIVES: /home/runner/apt-archives
        run: ./scripts/apt_install.sh zip
      - name: Cache raylib (web)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-web
          key: raylib-web-emsdk6.0.3-${{ hashFiles('scripts/build_raylib_web.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (web)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_web.sh
      # The site (danheskett's hugo.yml) takes opentrail-build-N-web-wasm.zip (the
      # modern game) and opentrail-classic-build-N-web-wasm.zip from the latest release.
      - name: Package both web games
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  build-ios:
    name: iOS device .ipa
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Apple refuses uploads built against an SDK older than iOS 26.
      - name: Check the iOS SDK is new enough for the App Store
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::iOS SDK $sdk is too old; the App Store requires 26+"; exit 1; }
      - name: Detect iOS signing secrets
        id: iossecret
        env:
          C: ${{ secrets.IOS_CERT_P12 }}
          P: ${{ secrets.IOS_CERT_PASSWORD }}
          M: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          T: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$C" ] && [ -n "$P" ] && [ -n "$M" ] && [ -n "$T" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Package the .ipa (unsigned)
        if: steps.iossecret.outputs.present == 'false'
        run: make dist-ios RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # The distribution certificate in a throwaway keychain, the App Store
      # profile embedded; the keychain dies with the runner.
      - name: Package the .ipa (App Store signed)
        if: steps.iossecret.outputs.present == 'true'
        env:
          IOS_CERT_P12:             ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD:        ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID:              ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/opentrail-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_CERT_P12"             | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Apple Distribution/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "no Apple Distribution identity" >&2; exit 1; }
          make dist-ios RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            IOS_SIGN_IDENTITY="$IDENTITY" IOS_PROFILE="$RUNNER_TEMP/profile.mobileprovision" IOS_TEAM_ID="$IOS_TEAM_ID"
      - name: Verify the .ipa is signed and App Store-shaped
        if: steps.iossecret.outputs.present == 'true'
        run: |
          set -euo pipefail
          app="build/ios-device/Payload/OpenTrail.app"
          codesign --verify --strict --verbose=2 "$app"
          test -f "$app/embedded.mobileprovision" && test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  build-android:
    name: android APK (sideload) + AAB (Play)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_PLATFORM_VER: "36"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK, build-tools and platform
        timeout-minutes: 20
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_PLATFORM_VER}" > /dev/null
      - name: Cache raylib (Android)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-android
          key: raylib-android-ndk26.3-${{ hashFiles('scripts/build_raylib_android.sh', 'scripts/raylib_flags.sh', 'scripts/raylib-android-eglconfig.patch') }}
      - name: Build raylib (Android)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: ./scripts/build_raylib_android.sh --ndk "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" --arch arm64 --arch x86_64
      - name: Package the sideload APK (debug-signed)
        run: |
          make dist-android RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            ANDROID_NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}"
      # All four signing secrets, or the AAB is skipped and the APK still ships.
      - name: Detect Play signing secrets
        id: playsecret
        env:
          K:  ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          A:  ${{ secrets.PLAY_KEY_ALIAS }}
          SP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$K" ] && [ -n "$A" ] && [ -n "$SP" ] && [ -n "$KP" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Package the Play bundle (AAB, upload-signed)
        if: steps.playsecret.outputs.present == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE:   ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEY_ALIAS:         ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD:      ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          make dist-android-play RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            ANDROID_NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks" PLAY_KEY_ALIAS="$PLAY_KEY_ALIAS" \
            PLAY_STORE_PASS="$PLAY_KEYSTORE_PASSWORD" PLAY_KEY_PASS="$PLAY_KEY_PASSWORD"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab

  publish:
    name: tag + publish GitHub Release
    needs: [prepare, build-linux-windows, build-mac, build-web, build-ios, build-android]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - run: ls -la dist-merged/
      # The two publishing steps, and only these, are what `dry_run` withholds. Everything
      # before them still runs, so a dry run proves the build and the packaging without
      # consuming a release number or putting anything in front of a user.
      - name: Create release-N tag at the captured commit
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false

  # The AAB to Play's internal track (testers only), after the GitHub Release
  # is out. Going further (closed, open, production) is store-release.yml's.
  publish-play:
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    name: AAB to the Play internal track
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      - name: Gate on the service account and a built AAB
        id: gate
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          aab=$(find dist -maxdepth 1 -name '*.aab' | head -1)
          if [ -n "$SA" ] && [ -n "$aab" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "aab=$aab" >> "$GITHUB_OUTPUT";
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Skipping Play (secret: $([ -n "$SA" ] && echo yes || echo no); AAB: $([ -n "$aab" ] && echo yes || echo no))."; fi
      - name: Upload to the internal track
        if: steps.gate.outputs.go == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.danheskett.opentrail
          releaseFiles: ${{ steps.gate.outputs.aab }}
          track: internal
          status: completed
          releaseName: release-${{ needs.prepare.outputs.version }}

  # The signed .ipa to App Store Connect (TestFlight), after the GitHub Release.
  # Submitting for review is store-release.yml's.
  publish-testflight:
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    name: .ipa to App Store Connect (TestFlight)
    needs: [prepare, publish]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: dist
      - name: Gate on the API key and a signed .ipa
        id: gate
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_KEY_ID }}
          S: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(find dist -maxdepth 1 -name '*.ipa' | head -1)
          signed=false
          if [ -n "$ipa" ] && unzip -l "$ipa" | grep -q '_CodeSignature'; then signed=true; fi
          if [ -n "$K" ] && [ -n "$I" ] && [ -n "$S" ] && [ "$signed" = true ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "ipa=$ipa" >> "$GITHUB_OUTPUT";
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Skipping App Store Connect (key: $([ -n "$K" ] && echo yes || echo no); signed .ipa: $signed)."; fi
      - name: Install the App Store Connect API key
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Validate, then upload
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f "${{ steps.gate.outputs.ipa }}" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "${{ steps.gate.outputs.ipa }}" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

  # "What to Test" on the build just uploaded (pure REST, so on Linux).
  testflight-notes:
    if: ${{ !inputs.dry_run && needs.publish-testflight.result == 'success' }}
    name: TestFlight notes
    needs: [prepare, publish-testflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Gate on the API key
        id: gate
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: if [ -n "$K" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Attach the notes
        if: steps.gate.outputs.go == 'true'
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID:     com.danheskett.opentrail
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: |
            release-${{ needs.prepare.outputs.version }}

            ${{ github.event.head_commit.message }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/testflight_notes.py
