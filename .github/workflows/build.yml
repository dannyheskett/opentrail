name: build

# Build and package. Runs on every merge of staging into main: picks the next
# sequential release-N tag, builds every platform, and publishes the GitHub
# Release with all the archives (the signed .ipa and .aab included). It never
# distributes: nothing here talks to Google Play, App Store Connect, TestFlight
# or Fly. Distribution is the separate, manual release workflow (release.yml),
# which ships a chosen release-N from its GitHub Release assets.
#
# danheskett.com is the one exception, by decision: the site pulls each game's
# latest GitHub Release when it builds, so a release published here reaches the
# site at its next build.
#
# Any failure fails the run and nothing after it runs: `publish` needs every
# build to have succeeded (a plain `needs:`), so a failed, cancelled or skipped
# build means no tag and no GitHub Release. Missing signing material is a
# failure, never a quiet skip -- a release without a signed .ipa or .aab cannot
# be distributed, so it is not a release.
#
# The tag is created in `publish` AFTER all builds succeed, so a failed build
# leaves N unused and the next run reuses it. The triggering commit SHA is
# captured in `prepare` and used everywhere, so a later push to main does not
# change what gets tagged. A GITHUB_TOKEN tag push starts no workflow, so this
# never retriggers itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
      # Store artwork, screenshots and listing text are not compiled into any
      # build, so changing them should not burn a release number. The release
      # workflow pushes the listing from the repo when it ships.
      - 'android/play-assets/**'
      - 'ios/app-store-assets/**'
      # boto3 for the Device Farm runner, used only by the manual devicefarm
      # workflow. It ends up in no shipped artifact, so a dependabot bump of it
      # should not cut a release either. The rest of scripts/ is NOT ignored --
      # build_raylib_*.sh, embed_ttf.py and gen_font_atlas.c all feed the builds.
      - 'scripts/requirements.txt'
  # A manual run is a test, so it defaults to a dry run; a push to main is a build.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything; tag nothing, publish nothing'
        type: boolean
        default: true

# A dry run is labelled as one everywhere it appears, so it can never be read
# as a published build.
run-name: ${{ inputs.dry_run && 'DRY RUN - build (nothing tagged or published)' || format('build {0}', github.sha) }}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

# bash -eo pipefail for every step: a failing command, including one inside a
# pipe, fails its step.
defaults:
  run:
    shell: bash

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  # As ci.yml: raylib cached per platform (keyed on its script and the trim),
  # apt through scripts/apt_install.sh, a time limit on each download.
  # RELEASE_VERSION is passed to every build: it names the packages and is
  # the version the opening screen shows (release-N).
  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-linux-mingw-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-linux-mingw-ubuntu22-
      - name: Install Linux + mingw deps
        timeout-minutes: 60
        env:
          APT_ARCHIVES: /home/runner/apt-archives
        run: |
          ./scripts/apt_install.sh \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 zip \
            python3-numpy python3-pil xvfb libgl1-mesa-dri
      - name: Cache raylib (Linux)
        id: raylib-linux
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install
          key: raylib-linux-ubuntu22-${{ hashFiles('scripts/build_raylib_linux.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (Linux)
        if: steps.raylib-linux.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: xvfb-run -a -s '-screen 0 1280x800x24' make test   # a display, so test_harness runs
      - name: Cache raylib (mingw win64 + win32)
        id: raylib-windows
        uses: actions/cache@v6
        with:
          path: |
            third_party/raylib-install-win64
            third_party/raylib-install-win32
          key: raylib-windows-ubuntu22-${{ hashFiles('scripts/build_raylib_windows.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (mingw win64 + win32)
        if: steps.raylib-windows.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_windows.sh
      - name: Package Linux + Windows archives
        run: make dist-linux dist-windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Cache raylib (universal arm64 + x86_64)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-mac
          key: raylib-mac-macos14-${{ hashFiles('scripts/build_raylib_mac.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (universal arm64 + x86_64)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_mac.sh
      - name: Package macOS archive
        run: make dist-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Emscripten
        timeout-minutes: 15
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.3
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-zip-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-zip-ubuntu22-
      - name: Install zip
        timeout-minutes: 60
        env:
          APT_ARCHIVES: /home/runner/apt-archives
        run: ./scripts/apt_install.sh zip
      - name: Cache raylib (web)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-web
          key: raylib-web-emsdk6.0.3-${{ hashFiles('scripts/build_raylib_web.sh', 'scripts/raylib_flags.sh') }}
      - name: Build raylib (web)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/build_raylib_web.sh
      # The site (danheskett's hugo.yml) takes opentrail-build-N-web-wasm.zip (the
      # modern game) and opentrail-classic-build-N-web-wasm.zip from the latest release.
      - name: Package both web games
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  build-ios:
    name: iOS device .ipa
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Apple refuses uploads built against an SDK older than iOS 26.
      - name: Check the iOS SDK is new enough for the App Store
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::iOS SDK $sdk is too old; the App Store requires 26+"; exit 1; }
      # A release needs an App Store-signed .ipa, so every signing secret is
      # required; a missing one fails the build rather than producing an
      # unsigned .ipa that could never be distributed.
      - name: Require the iOS signing secrets
        env:
          C: ${{ secrets.IOS_CERT_P12 }}
          P: ${{ secrets.IOS_CERT_PASSWORD }}
          M: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          T: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$C" ] || missing="$missing IOS_CERT_P12"
          [ -n "$P" ] || missing="$missing IOS_CERT_PASSWORD"
          [ -n "$M" ] || missing="$missing IOS_PROVISIONING_PROFILE"
          [ -n "$T" ] || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing iOS signing secret(s):$missing"
            exit 1
          fi
      # The distribution certificate in a throwaway keychain, the App Store
      # profile embedded; the keychain dies with the runner.
      - name: Package the .ipa (App Store signed)
        env:
          IOS_CERT_P12:             ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD:        ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID:              ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/opentrail-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_CERT_P12"             | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Apple Distribution/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "no Apple Distribution identity" >&2; exit 1; }
          make dist-ios RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            IOS_SIGN_IDENTITY="$IDENTITY" IOS_PROFILE="$RUNNER_TEMP/profile.mobileprovision" IOS_TEAM_ID="$IOS_TEAM_ID"
      - name: Verify the .ipa is signed and App Store-shaped
        run: |
          set -euo pipefail
          app="build/ios-device/Payload/OpenTrail.app"
          codesign --verify --strict --verbose=2 "$app"
          test -f "$app/embedded.mobileprovision" && test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  build-android:
    name: android APK (sideload) + AAB (Play)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_PLATFORM_VER: "36"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK, build-tools and platform
        timeout-minutes: 20
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_PLATFORM_VER}" > /dev/null
      - name: Cache raylib (Android)
        id: raylib
        uses: actions/cache@v6
        with:
          path: third_party/raylib-install-android
          key: raylib-android-ndk26.3-${{ hashFiles('scripts/build_raylib_android.sh', 'scripts/raylib_flags.sh', 'scripts/raylib-android-eglconfig.patch') }}
      - name: Build raylib (Android)
        if: steps.raylib.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: ./scripts/build_raylib_android.sh --ndk "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" --arch arm64 --arch x86_64
      # The sideload APK signs with the project's sideload key (registered for
      # the package under Android developer verification), so each release
      # installs over the last; without the secrets, a throwaway debug key.
      - name: Package the sideload APK
        env:
          ANDROID_SIDELOAD_KEYSTORE: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE }}
          ANDROID_SIDELOAD_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_PASSWORD }}
        run: |
          KEY=()
          if [ -n "$ANDROID_SIDELOAD_KEYSTORE" ] && [ -n "$ANDROID_SIDELOAD_PASSWORD" ]; then
            echo "$ANDROID_SIDELOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            KEY=(ANDROID_KEYSTORE="$RUNNER_TEMP/sideload.jks" ANDROID_KEY_ALIAS=opentrail-sideload
                 ANDROID_STORE_PASS="$ANDROID_SIDELOAD_PASSWORD")
          else
            echo "::warning::ANDROID_SIDELOAD_* secrets not set: the APK is signed with a throwaway key and will not install over earlier releases"
          fi
          make dist-android RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            ANDROID_NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" "${KEY[@]}"
      # A release needs the upload-signed AAB, so every Play signing secret is
      # required; a missing one fails the build rather than quietly shipping
      # only the sideload APK.
      - name: Require the Play signing secrets
        env:
          K:  ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          SP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$K" ]  || missing="$missing PLAY_UPLOAD_KEYSTORE"
          [ -n "$SP" ] || missing="$missing PLAY_KEYSTORE_PASSWORD"
          [ -n "$KP" ] || missing="$missing PLAY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing Play signing secret(s):$missing"
            exit 1
          fi
      - name: Package the Play bundle (AAB, upload-signed)
        env:
          PLAY_UPLOAD_KEYSTORE:   ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEY_ALIAS:         ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD:      ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          make dist-android-play RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            ANDROID_NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks" PLAY_KEY_ALIAS="$PLAY_KEY_ALIAS" \
            PLAY_STORE_PASS="$PLAY_KEYSTORE_PASSWORD" PLAY_KEY_PASS="$PLAY_KEY_PASSWORD"
      # Both files must exist: the release workflow ships the AAB to Play.
      - name: Check both Android artifacts exist
        run: |
          ls dist/*.apk dist/*.aab
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab

  publish:
    name: tag + publish GitHub Release
    # A plain `needs:`: this runs only if every build succeeded.
    needs: [prepare, build-linux-windows, build-mac, build-web, build-ios, build-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - run: ls -la dist-merged/
      # Every platform's archive must be here before anything is tagged.
      - name: Check every artifact is present
        run: |
          for pat in '*-android-arm64.apk' '*-android.aab' '*-ios-arm64.ipa' \
                     '*-linux-x86_64.tar.gz' '*-macos-universal.zip' '*-web-wasm.zip' \
                     '*-windows-x64.zip' '*-windows-x86.zip'; do
            compgen -G "dist-merged/$pat" >/dev/null || { echo "::error::no artifact matching $pat"; exit 1; }
          done
      # The two publishing steps, and only these, are what `dry_run` withholds. Everything
      # before them still runs, so a dry run proves the build and the packaging without
      # consuming a release number or putting anything in front of a user.
      - name: Create release-N tag at the captured commit
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
