version: 2
updates:
  # Keep the GitHub Actions used by CI (actions/checkout, etc.) up to date,
  # batched into one weekly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # pull requests go to staging: main only takes staging's (the rulesets)
    target-branch: "staging"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
